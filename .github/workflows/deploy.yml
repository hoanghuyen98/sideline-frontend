name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - production
          - env_2.24.71.55

jobs:
  deploy-production:
    if: |
      github.event.inputs.environment == 'all' ||
      github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha_short: ${{ steps.info.outputs.sha_short }}
      commit_msg: ${{ steps.info.outputs.commit_msg }}
      author: ${{ steps.info.outputs.author }}
    steps:
      - uses: actions/checkout@v4

      - name: Get build info
        id: info
        run: |
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install

      # ✅ Build với đúng vars của environment production
      - name: Build
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_DOMAIN_WEB: ${{ vars.VITE_DOMAIN_WEB }}
        run: npm run build

      - name: Prepare temp folder on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/frontend_new
            sudo rm -rf /var/www/frontend_new/*

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/var/www/frontend_new"
          strip_components: 1

      - name: Swap folder & set permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/frontend
            sudo mv /var/www/frontend /var/www/frontend_old
            sudo mv /var/www/frontend_new /var/www/frontend
            sudo rm -rf /var/www/frontend_old
            sudo chown -R www-data:www-data /var/www/frontend

  notify-production:
    needs: deploy-production
    if: always() && (github.event.inputs.environment == 'all' || github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set status
        id: status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "text=✅ Thành công" >> $GITHUB_OUTPUT
          else
            echo "text=❌ Thất bại" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ vars.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *🚀 Thông báo Deploy - Sideline Frontend*

            🌍 *Môi trường:* `production`
            📊 *Trạng thái:* `${{ steps.status.outputs.text }}`
            📝 *Commit:* `${{ needs.deploy-production.outputs.commit_msg }}`
            🆔 *SHA:* `${{ needs.deploy-production.outputs.sha_short }}`
            👤 *Deploy by:* `${{ github.actor }}`
            👤 *Commit by:* `${{ needs.deploy-production.outputs.author }}`

            *Chi tiết:* [GitHub Action Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy-server2:
    if: |
      github.event.inputs.environment == 'all' ||
      github.event.inputs.environment == 'env_2.24.71.55'
    runs-on: ubuntu-latest
    environment: env_2.24.71.55
    outputs:
      sha_short: ${{ steps.info.outputs.sha_short }}
      commit_msg: ${{ steps.info.outputs.commit_msg }}
      author: ${{ steps.info.outputs.author }}
    steps:
      - uses: actions/checkout@v4

      - name: Get build info
        id: info
        run: |
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install

      # ✅ Build với đúng vars của environment env_2.24.71.55
      - name: Build
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_DOMAIN_WEB: ${{ vars.VITE_DOMAIN_WEB }}
        run: npm run build

      - name: Prepare temp folder on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/frontend_new
            sudo rm -rf /var/www/frontend_new/*

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/var/www/frontend_new"
          strip_components: 1

      - name: Swap folder & set permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/frontend
            sudo mv /var/www/frontend /var/www/frontend_old
            sudo mv /var/www/frontend_new /var/www/frontend
            sudo rm -rf /var/www/frontend_old
            sudo chown -R www-data:www-data /var/www/frontend

  notify-server2:
    needs: deploy-server2
    if: always() && (github.event.inputs.environment == 'all' || github.event.inputs.environment == 'env_2.24.71.55')
    runs-on: ubuntu-latest
    environment: env_2.24.71.55
    steps:
      - name: Set status
        id: status
        run: |
          if [ "${{ needs.deploy-server2.result }}" == "success" ]; then
            echo "text=✅ Thành công" >> $GITHUB_OUTPUT
          else
            echo "text=❌ Thất bại" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ vars.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *🚀 Thông báo Deploy - Sideline Frontend*

            🌍 *Môi trường:* `env_2.24.71.55`
            📊 *Trạng thái:* `${{ steps.status.outputs.text }}`
            📝 *Commit:* `${{ needs.deploy-server2.outputs.commit_msg }}`
            🆔 *SHA:* `${{ needs.deploy-server2.outputs.sha_short }}`
            👤 *Deploy by:* `${{ github.actor }}`
            👤 *Commit by:* `${{ needs.deploy-server2.outputs.author }}`

            *Chi tiết:* [GitHub Action Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})