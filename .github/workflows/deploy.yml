name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - production
          - env_2.24.71.55
      run_id:
        description: 'CI run ID (để trống = tự lấy bản build mới nhất)'
        required: false
        type: string

jobs:
  resolve-artifact:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve run ID
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const inputRunId = '${{ github.event.inputs.run_id }}';
            if (inputRunId) {
              console.log(`Using provided run_id: ${inputRunId}`);
              core.setOutput('run_id', inputRunId);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              status: 'success',
              per_page: 1
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('Không tìm thấy CI run nào thành công!');
              return;
            }

            const latestRunId = runs.data.workflow_runs[0].id;
            console.log(`Auto-resolved run_id: ${latestRunId}`);
            core.setOutput('run_id', latestRunId);

  deploy-production:
    needs: resolve-artifact
    if: |
      github.event.inputs.environment == 'all' ||
      github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha_short: ${{ steps.info.outputs.sha_short }}
      commit_msg: ${{ steps.info.outputs.commit_msg }}
      author: ${{ steps.info.outputs.author }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.resolve-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read build info
        id: info
        run: |
          cat dist/build-info.json
          echo "sha_short=$(jq -r '.sha_short' dist/build-info.json)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(jq -r '.commit_msg' dist/build-info.json)" >> $GITHUB_OUTPUT
          echo "author=$(jq -r '.author' dist/build-info.json)" >> $GITHUB_OUTPUT

      - name: Prepare temp folder on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/frontend_new
            sudo rm -rf /var/www/frontend_new/*

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/var/www/frontend_new"
          strip_components: 1

      - name: Swap folder & set permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/frontend
            sudo mv /var/www/frontend /var/www/frontend_old
            sudo mv /var/www/frontend_new /var/www/frontend
            sudo rm -rf /var/www/frontend_old
            sudo chown -R www-data:www-data /var/www/frontend

  notify-production:
    needs: deploy-production
    if: always() && (github.event.inputs.environment == 'all' || github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ vars.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *🚀 Thông báo Deploy - Sideline Frontend*

            🌍 *Môi trường:* `production`
            📊 *Trạng thái:* `${{ needs.deploy-production.result == 'success' && '✅ Thành công' || '❌ Thất bại' }}`
            📝 *Commit:* `${{ needs