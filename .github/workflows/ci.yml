name: CI/CD Frontend

on:
  push:
    branches: ["main"]  # Chỉ auto-deploy khi push vào main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - production
          - env_2.24.71.55
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install

      - name: Build
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_DOMAIN_WEB: ${{ vars.VITE_DOMAIN_WEB }}
        run: npm run build

  deploy-production:
    needs: build
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.environment == 'all' ||
        github.event.inputs.environment == 'production'
      ))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DEPLOY_BRANCH="${{ github.event.inputs.branch || 'main' }}"
            PROJECT_DIR="/root/green_sideline/frontend"
            REPO_URL="https://${{ secrets.GH_TOKEN }}@github.com/hoanghuyen98/sideline-frontend.git"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Folder chưa tồn tại. Đang tiến hành clone..."
              git clone $REPO_URL $PROJECT_DIR
            fi

            cd $PROJECT_DIR
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/hoanghuyen98/sideline-frontend.git
            git checkout $DEPLOY_BRANCH
            git pull https://${{ secrets.GH_TOKEN }}@github.com/hoanghuyen98/sideline-frontend.git $DEPLOY_BRANCH

            if [ ! -d "$PROJECT_DIR/node_modules" ] || [ package.json -nt node_modules ]; then
              npm install
            fi

            VITE_BASE_URL=${{ vars.VITE_BASE_URL }} VITE_DOMAIN_WEB=${{ vars.VITE_DOMAIN_WEB }} npm run build

            sudo mkdir -p /var/www/frontend
            sudo cp -r dist/* /var/www/frontend/
            sudo chown -R www-data:www-data /var/www/frontend

  deploy-server2:
    needs: build
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.environment == 'all' ||
        github.event.inputs.environment == 'env_2.24.71.55'
      )
    runs-on: ubuntu-latest
    environment: env_2.24.71.55
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DEPLOY_BRANCH="${{ github.event.inputs.branch || 'main' }}"
            PROJECT_DIR="/root/green_sideline/frontend"
            REPO_URL="https://${{ secrets.GH_TOKEN }}@github.com/hoanghuyen98/sideline-frontend.git"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Folder chưa tồn tại. Đang tiến hành clone..."
              git clone $REPO_URL $PROJECT_DIR
            fi

            cd $PROJECT_DIR
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/hoanghuyen98/sideline-frontend.git
            git checkout $DEPLOY_BRANCH
            git pull https://${{ secrets.GH_TOKEN }}@github.com/hoanghuyen98/sideline-frontend.git $DEPLOY_BRANCH

            if [ ! -d "$PROJECT_DIR/node_modules" ] || [ package.json -nt node_modules ]; then
              npm install
            fi

            VITE_BASE_URL=${{ vars.VITE_BASE_URL }} VITE_DOMAIN_WEB=${{ vars.VITE_DOMAIN_WEB }} npm run build

            sudo mkdir -p /var/www/frontend
            sudo cp -r dist/* /var/www/frontend/
            sudo chown -R www-data:www-data /var/www/frontend